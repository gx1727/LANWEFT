  <div class="note blue">
    <strong>本章要点</strong>：控制面走 TCP 长连接，数据面走 UDP。<code>login</code> <strong>必须</strong>是连接上的
    <strong>第一条</strong>消息，<code>login_ack.sessions</code> 是<strong>权威快照</strong>。
    接收方<strong>必须</strong>周期性下发缺失裁决（即使列表为空），它是发送方推进的<strong>唯一依据</strong>；
    发送方 {{VAR:adjudicate_request_ms}} ms 未收到裁决时<strong>必须</strong>主动索要。
    文件级失配走<strong>恢复阶梯</strong>：①摘要对帐（零内容流量定位差异区间）→ ②复核轮（全量重传，至多一次）→ ③中止。
    主动投递方向恒为 <strong>download</strong>，Server <strong>必须</strong>等到 <code>UDP_PROBE</code> 才可推送；
    共享清单的通知<strong>不保证送达</strong>，拉取路径复用既有下载流程。
  </div>
