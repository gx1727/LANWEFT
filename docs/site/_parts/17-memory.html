<h2>内存与文件大小解耦</h2>

<div class="diagram">
  <div class="fields" style="--cols:2">
    <div class="cell ruler-title">文件大小</div>
    <div class="cell ruler-title">常驻内存</div>
    <div class="cell f-len">GB 级（线性增长）</div>
    <div class="cell f-chunk">≈ 常数（payload 缓冲 + 位图 + 会话状态）</div>
  </div>
</div>

<div class="caption">
  常驻内存<strong>应当</strong>只包含：数据面 payload 缓冲、位图、会话状态；
  内存占用<strong>应当</strong>与 <code>chunk_size</code> 成正比，
  而<strong>不</strong>与文件大小成正比 —— 这是「内存与文件大小解耦」目标的直接体现（推荐性）。
</div>
