<div class="note blue">
    <strong>本章要点</strong>：数据面数据包为<strong>小端序定长头 + 载荷 + CRC32</strong>；
    头部 <strong>16 字节</strong>，尾部 <strong>4 字节</strong> CRC（覆盖头 + 载荷，不含 CRC 自身）。
    CRC 变体固定为 <strong>CRC-32/ISO-HDLC</strong>（zlib <code>crc32</code>），两端各选一种会导致
    <strong>所有包校验失败</strong>，故本规范不留实现选择空间。
    <code>payload_len</code> 受 <code>chunk_size</code> 约束（上限 1400 字节，避免 IP 分片）；
    校验失败的包<strong>不得</strong>写入位图 —— 代价是<strong>一个块</strong>，与文件大小无关。
  </div>
