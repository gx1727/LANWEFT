  <h2>UDP 可用性探测</h2>

  <h2>交互流程</h2>
  <div class="diagram">
    <div class="fields">
      <div class="cell ruler-title">UDP Availability Probe</div>

      <div class="cell bitnum">①</div>
      <div class="cell bitnum">②</div>
      <div class="cell bitnum">③</div>
      <div class="cell bitnum">超时</div>

      <div class="cell f-type span4">Client → Server：UDP_PROBE</div>
      <div class="cell f-type span4">Server → Client：UDP_PROBE_ACK</div>
