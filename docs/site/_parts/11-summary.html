<div class="note blue">
    <strong>本章要点</strong>：流控有<strong>两级</strong>在途上限 —— 会话级 <code>window</code>
    （规范默认值 {{VAR:c11_window_default}}）与连接级 <code>connection_window</code>
    （规范默认值 {{VAR:c11_connwin_default}}），二者<strong>必须同时满足</strong>。
    协议<strong>无逐包 ACK</strong>：发送方推进窗口的<strong>唯一</strong>依据是接收方周期性下发的
    <code>missing_chunks</code>（<code>mode=report</code>），<strong>空列表裁决也必须下发</strong>，
    否则窗口填满后协议死锁。AIMD 只是发送端本地策略，<strong>不属于</strong>互操作要求。
  </div>
