<div class="note blue">
  <strong>本章要点</strong>：数据面以 <strong>UDP</strong> 为默认传输，原则是
  <strong>无连接、无逐包 ACK、允许丢包与乱序</strong>，并按会话安全等级做包级校验
  （lv1 <code>crc32</code>，lv2/lv3 keyed MAC / AEAD tag，默认 lv1）；
  UDP 不可用时回退到<strong>数据面</strong> TCP 通道（与 06 章的控制面 TCP 长连接<strong>完全无关</strong>）。
  数据面<strong>不得</strong>改变会话状态，只更新接收侧位图。
</div>
