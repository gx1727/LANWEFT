  <h2>状态机图</h2>
  <div class="diagram">
    <svg class="sm-svg" viewBox="0 0 1120 600" role="img" aria-label="Session 状态机：INIT、NEGOTIATING、TRANSFERRING、PAUSED、VERIFY、COMMIT、COMPLETED、ABORTED 及带触发消息的转移边">
      <defs>
        <marker id="sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6478"></path>
        </marker>
        <marker id="sm-arrow-sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#a855f7"></path>
        </marker>
        <marker id="sm-arrow-ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"></path>
        </marker>
      </defs>

      <!-- ===== 节点 ===== -->
      <g>
        <rect class="sm-box" x="30" y="60" width="120" height="56" rx="12"></rect>
        <text class="sm-name" x="90" y="83" text-anchor="middle">INIT</text>
        <text class="sm-sub" x="90" y="101" text-anchor="middle">双方</text>
      </g>
      <g>
        <rect class="sm-box" x="190" y="60" width="170" height="56" rx="12"></rect>
        <text class="sm-name" x="275" y="83" text-anchor="middle">NEGOTIATING</text>
        <text class="sm-sub" x="275" y="101" text-anchor="middle">双方</text>
      </g>
      <g>
        <rect class="sm-box" x="400" y="60" width="180" height="56" rx="12"></rect>
        <text class="sm-name" x="490" y="83" text-anchor="middle">TRANSFERRING</text>
        <text class="sm-sub" x="490" y="101" text-anchor="middle">双方</text>
      </g>
      <g>
        <rect class="sm-box rx" x="620" y="60" width="120" height="56" rx="12"></rect>
        <text class="sm-name" x="680" y="83" text-anchor="middle">VERIFY</text>
        <text class="sm-sub" x="680" y="101" text-anchor="middle">仅接收侧</text>
      </g>
      <g>
        <rect class="sm-box rx" x="780" y="60" width="120" height="56" rx="12"></rect>
        <text class="sm-name" x="840" y="83" text-anchor="middle">COMMIT</text>
        <text class="sm-sub" x="840" y="101" text-anchor="middle">仅接收侧</text>
      </g>
      <g>
        <rect class="sm-box" x="940" y="60" width="170" height="56" rx="12"></rect>
        <text class="sm-name" x="1025" y="83" text-anchor="middle">COMPLETED</text>
        <text class="sm-sub" x="1025" y="101" text-anchor="middle">双方</text>
      </g>
      <g>
        <rect class="sm-box pa" x="400" y="240" width="180" height="56" rx="12"></rect>
        <text class="sm-name" x="490" y="263" text-anchor="middle">PAUSED</text>
        <text class="sm-sub" x="490" y="281" text-anchor="middle">双方</text>
      </g>
      <g>
        <rect class="sm-box ab" x="30" y="430" width="180" height="56" rx="12"></rect>
        <text class="sm-name" x="120" y="453" text-anchor="middle">ABORTED</text>
        <text class="sm-sub" x="120" y="471" text-anchor="middle">终态 · 无出边</text>
      </g>

      <!-- ===== 常规转移 ===== -->
      <path class="sm-edge" d="M 150,88 H 186" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="170" y="46" text-anchor="middle">upload_start / download_start</text>

      <path class="sm-edge" d="M 360,88 H 396" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="380" y="46" text-anchor="middle">upload_accept / download_accept</text>

      <path class="sm-edge" d="M 580,88 H 616" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="600" y="46" text-anchor="middle">位图全真（接收侧）</text>

      <path class="sm-edge" d="M 740,88 H 776" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="760" y="46" text-anchor="middle">Blake3 校验通过</text>

      <path class="sm-edge" d="M 900,88 H 936" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="930" y="28" text-anchor="middle">原子重命名完成 → upload_complete / download_complete</text>

      <!-- 暂停 / 恢复 -->
      <path class="sm-edge" d="M 470,116 V 240" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="462" y="184" text-anchor="end">session_pause</text>
      <path class="sm-edge" d="M 510,240 V 116" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="518" y="184" text-anchor="start">resume_session / resume_ack</text>

      <!-- missing_chunks 自环（维持 TRANSFERRING，触发补发） -->
      <path class="sm-edge" d="M 412,116 C 412,152 448,152 448,116" marker-end="url(#sm-arrow)"></path>
      <text class="sm-lbl" x="402" y="142" text-anchor="end">missing_chunks</text>
      <text class="sm-lbl" x="402" y="157" text-anchor="end">(mode=report) 触发补发</text>

      <!-- 秒传（接收侧）NEGOTIATING → VERIFY -->
      <path class="sm-edge sp" d="M 275,60 V 20 H 680 V 56" marker-end="url(#sm-arrow-sp)"></path>
      <text class="sm-lbl sp" x="477" y="13" text-anchor="middle">秒传 file_exists（接收侧）：NEGOTIATING → VERIFY</text>

      <!-- 秒传（发送侧）NEGOTIATING → COMPLETED -->
      <path class="sm-edge sp" d="M 250,116 V 340 H 980 V 116" marker-end="url(#sm-arrow-sp)"></path>
      <text class="sm-lbl sp" x="640" y="330" text-anchor="middle">秒传 file_exists（发送侧）：NEGOTIATING → COMPLETED</text>

      <!-- 任意状态 → ABORTED -->
      <path class="sm-edge ab" d="M 90,116 V 430" marker-end="url(#sm-arrow-ab)"></path>
      <text class="sm-lbl ab" x="100" y="300" text-anchor="start">session_abort</text>

      <path class="sm-edge ab" d="M 1060,116 V 560 H 175 V 486" marker-end="url(#sm-arrow-ab)"></path>
      <text class="sm-lbl ab" x="620" y="552" text-anchor="middle">session_abort：任意状态 → ABORTED（终态，无出边）</text>
    </svg>
  </div>

  <div class="legend">
    <span><i class="swatch" style="background:#fff;border-color:#c7d2e0"></i>双方共用的状态</span>
    <span><i class="swatch" style="background:#eefaf1;border-color:#9fd8b0"></i>仅接收侧的状态（VERIFY / COMMIT）</span>
    <span><i class="swatch" style="background:#fdf6e3;border-color:#e6cf92"></i>双方共用的 PAUSED</span>
    <span><i class="swatch" style="background:#fdeeed;border-color:#efb0ad"></i>终态 ABORTED</span>
    <span><i class="swatch" style="background:#fff;border-color:#a855f7"></i>虚线 = 秒传路径（file_exists = 1）</span>
    <span><i class="swatch" style="background:#fff;border-color:#dc2626"></i>红色虚线 = session_abort</span>
  </div>
  <p class="caption">图 10-1　Session 状态机。ABORTED 位于左侧，VERIFY / COMMIT 位于右侧；发送侧不经过 VERIFY / COMMIT。</p>
