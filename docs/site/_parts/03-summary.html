  <strong>本章要点</strong>：本章给出 LANWEFT 的<strong>设计目标清单</strong>（下方正文即清单本身），
  涵盖大文件同步效率、可恢复性、乱序写盘、重传裁决清晰、内存与文件大小解耦、分层清晰、
  发送端策略简化与稳定，以及完整性可恢复（单块损坏定点修复、文件级失配可对帐定位并复核重传）、
  资源可界定（<strong>会话级与连接级两级在途上限</strong>）与素材可发现
  （Server 可预置素材并共享，Client 可发现并按既有流程拉取）。
  本章只列目标，<strong>不含具体条款</strong>；与之互补的范围边界见
