<div class="note blue">
  <strong>本章要点</strong>：LANWEFT 是面向可信局域网的混合文件同步协议，通过「控制面 TCP + 数据面 UDP」
  双通道协作，在保证高吞吐的同时实现<strong>可中断、可恢复、可裁决</strong>的文件同步能力。
  本章给出核心特性，规定控制面载荷的<strong>小端二进制定长布局</strong>与基础类型，
  给出<strong>发送侧 / 接收侧</strong>的视角定义、文档约定与规范性用语的强度，
  并声明协议版本与状态（规范草案修订中、尚未冻结；版本策略见
  <a href="26-roadmap.html">26 章</a>）。本章同时规定：<strong>规范源文是唯一真源</strong>，
  站点页面只是<strong>可视化导读</strong>，两者不一致时以源文为准。
</div>
