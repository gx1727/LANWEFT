name: Deploy spec site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/spec/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/site/**'
      - 'docs/spec/**'
      - 'scripts/**'
      - 'README.md'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# PR 校验与正式部署用不同的并发组：PR 不会取消 / 覆盖 main 的发布
concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时自动启用（等价于 Settings → Pages → Source = GitHub Actions）
          enablement: true

      - name: Check spec consistency
        run: python3 scripts/check-spec-consistency.py

      - name: Check site is in sync with spec
        run: python3 scripts/render-site.py --check

      - name: Build site
        run: scripts/build-site.sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    # PR 只做构建校验，不发布到 Pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
